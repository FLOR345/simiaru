server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El service worker siempre se revisa para tomar la versión nueva
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Archivos con hash en el nombre: se pueden guardar mucho tiempo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Rutas de la SPA (/dashboard, /lesson/3, /aula…) → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
